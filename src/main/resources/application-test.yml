spring:
  main:
    allow-bean-definition-overriding: true
  config:
    activate:
      on-profile: test
  thymeleaf:
    prefix: file:mykku-be-config/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  web:
    resources:
      add-mappings: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mykku_test
    username: root
    password:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 25
    username: test
    password: test
  data:
    redis:
      host: localhost
      port: 6379
      ssl:
        enabled: false

jwt:
  secret: ${JWT_SECRET:your-secret-key-should-be-very-long-and-secure-at-least-32-characters-long}
  access-token-expiration: 86400000 # 1 day
  refresh-token-expiration: 1209600000 # 14 days

aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY:your-s3-access-key}
    secret-key: ${AWS_S3_SECRET_KEY:your-s3-secret-key}
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket-name: ${AWS_S3_BUCKET_NAME:mykku-bucket}
    cloudfront-domain: "test"

admin:
  token: "test-admin-token"
