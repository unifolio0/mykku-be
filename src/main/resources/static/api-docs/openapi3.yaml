        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-contests410054999"
            examples:
              contest-create:
                value: |-
                  {
                    "title" : "겨울 일러스트 콘테스트",
                    "expiredAt" : "2024-12-31T23:59:00",
                    "images" : [ {
                      "url" : "https://api.mykku.com/contest1.jpg",
