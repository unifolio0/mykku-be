openapi: 3.0.1
info:
  title: MyKKU API
  description: MyKKU 백엔드 API 문서
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Local Development
- url: https://api.dev.mykku.kr
  description: Dev
tags: []
paths:
  /admin/api/v1/roles:
    get:
      tags:
      - admin
      operationId: admin-role-get-all
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/admin-api-v1-roles1128813764"
              examples:
                admin-role-get-all:
                  value: |-
                    {
                      "message" : "칭호 목록 조회 성공",
                      "data" : [ {
                        "id" : 1,
                        "name" : "신입 덕후",
                        "description" : "처음 가입한 회원"
                      }, {
                        "id" : 2,
                        "name" : "열정 덕후",
                        "description" : "활동이 활발한 회원"
                      }, {
                        "id" : 3,
                        "name" : "베테랑 덕후",
                        "description" : "오래된 회원"
                      } ]
                    }
    post:
      tags:
      - admin
      operationId: admin-role-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/admin-api-v1-roles-roleId-1521505460"
            examples:
              admin-role-create:
                value: |-
                  {
                    "name" : "슈퍼 덕후",
                    "description" : "최고 등급 회원"
                  }
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/admin-api-v1-roles753082484"
              examples:
                admin-role-create:
                  value: |-
                    {
                      "message" : "칭호 생성 성공",
                      "data" : {
                        "id" : 1,
                        "name" : "슈퍼 덕후",
                        "description" : "최고 등급 회원"
                      }
                    }
  /admin/api/v1/roles/{roleId}:
    put:
      tags:
      - admin
      operationId: admin-role-update
      parameters:
      - name: roleId
        in: path
        description: 수정할 칭호 ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/admin-api-v1-roles-roleId-1521505460"
            examples:
              admin-role-update:
                value: |-
                  {
                    "name" : "수정된 덕후",
                    "description" : "수정된 설명"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/admin-api-v1-roles-roleId-3663233"
              examples:
                admin-role-update:
                  value: |-
                    {
                      "message" : "칭호 수정 성공",
                      "data" : {
                        "id" : 1,
                        "name" : "수정된 덕후",
                        "description" : "수정된 설명"
                      }
                    }
    delete:
      tags:
      - admin
      operationId: admin-role-delete
      parameters:
      - name: roleId
        in: path
        description: 삭제할 칭호 ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-email-auth-verify-code-1606191098"
              examples:
                admin-role-delete:
                  value: |-
                    {
                      "message" : "칭호 삭제 성공",
                      "data" : { }
                    }
  /admin/api/v1/roles/{roleId}/members/{memberId}:
    post:
      tags:
      - admin
      operationId: admin-role-assign
      parameters:
      - name: roleId
        in: path
        description: 부여할 칭호 ID
        required: true
        schema:
          type: string
      - name: memberId
        in: path
        description: 칭호를 부여받을 회원 ID
        required: true
        schema:
          type: string
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/admin-api-v1-roles-roleId-members-memberId2104376708"
              examples:
                admin-role-assign:
                  value: |-
                    {
                      "message" : "칭호 부여 성공",
                      "data" : {
                        "id" : 1,
                        "role" : {
                          "id" : 1,
                          "name" : "열정 덕후",
                          "description" : "활동이 활발한 회원"
                        },
                        "isRepresentative" : false,
                        "earnedAt" : "2025-11-30T20:54:16.308786"
                      }
                    }
  /api/v1/board:
    post:
      tags:
      - api
      operationId: board-createboard-create-error-duplicateerror-400error-500
      parameters:
      - name: Authorization
        in: header
        description: "JWT 인증 토큰 (Bearer {token})"
        required: true
        schema:
          type: string
        example: Bearer jwt-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api-v1-board-id-1104364924"
            examples:
              board-create-error-duplicate:
                value: |-
                  {
                    "title" : "자유게시판",
                    "logo" : "https://api.mykku.com/board-logo.png"
                  }
              error-400:
                value: |-
                  {
                    "title" : "이미 존재하는 게시판",
                    "logo" : "https://api.mykku.com/board-logo.png"
                  }
              error-500:
                value: |-
                  {
                    "title" : "새로운 게시판",
                    "logo" : "https://api.mykku.com/board-logo.png"
                  }
              board-create:
                value: |-
                  {
                    "title" : "자유게시판",
                    "logo" : "https://api.mykku.com/board-logo.png"
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-fan-notes-fanNoteId475340455"
              examples:
                board-create-error-duplicate:
                  value: |-
                    {
                      "message" : "이미 존재하는 게시판 제목입니다"
                    }
                error-400:
                  value: |-
                    {
                      "message" : "이미 존재하는 게시판 제목입니다"
                    }
        "500":
          description: "500"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-fan-notes-fanNoteId475340455"
              examples:
                error-500:
                  value: |-
                    {
                      "message" : "서버 오류가 발생했습니다. 관리자에게 문의해주세요."
                    }
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-board-1298956503"
              examples:
                board-create:
                  value: |-
                    {
                      "message" : "게시판이 성공적으로 생성되었습니다.",
                      "data" : {
                        "id" : 1,
                        "title" : "자유게시판",
                        "logo" : "https://example.com/board-logo.png"
                      }
                    }
  /api/v1/contests:
