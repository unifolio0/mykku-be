              examples:
                contest-create:
                  value: |-
                    {
                      "message" : "콘테스트가 성공적으로 생성되었습니다.",
                      "data" : {
                        "id" : 1,
                        "title" : "겨울 일러스트 콘테스트",
                        "expiredAt" : "2024-12-31T23:59:00",
                        "images" : [ {
                          "url" : "https://example.com/contest1.jpg",
                          "orderIndex" : 0
                        }, {
                          "url" : "https://example.com/contest2.jpg",
                          "orderIndex" : 1
