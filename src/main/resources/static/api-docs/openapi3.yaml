components:
  schemas:
    api-v1-email-auth-signup-4481221:
      required:
      - data
      - message
      type: object
      properties:
        data:
          required:
          - accessToken
          - accessTokenExpiresIn
          - isExistingUser
          - member
          - refreshToken
          - refreshTokenExpiresIn
          - tokenType
          type: object
          properties:
            refreshTokenExpiresIn:
              type: number
              description: 리프레시 토큰 만료 시간 (밀리초)
            accessTokenExpiresIn:
              type: number
              description: 액세스 토큰 만료 시간 (밀리초)
            isExistingUser:
              type: boolean
              description: 기존 가입자 여부
            member:
              required:
              - email
              - id
              - nickname
              type: object
              properties:
                nickname:
                  type: string
                  description: 회원 닉네임
                profileImage:
                  type: string
                  description: 프로필 이미지 URL
                  nullable: true
                id:
                  type: string
                  description: 회원 ID
                email:
                  type: string
                  description: 회원 이메일
              description: 회원 정보
            tokenType:
              type: string
              description: 토큰 타입
            accessToken:
