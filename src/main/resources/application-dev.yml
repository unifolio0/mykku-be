spring:
  config:
    import: dev-secret.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
      enabled: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  web:
    resources:
      add-mappings: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${secret.datasource.url}:${secret.datasource.port}/${secret.datasource.database}?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&autoReconnect=true&serverTimezone=Asia/Seoul&useLegacyDatetimeCode=false
    username: ${secret.datasource.username}
    password: ${secret.datasource.password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

jwt:
  secret: ${secret.jwt.secret_key}
  access-token-expiration: ${secret.jwt.access_token_expiration}
  refresh-token-expiration: ${secret.jwt.refresh_token_expiration}

aws:
  s3:
    enabled: true
    access-key: ${secret.aws.s3.access_key}
    secret-key: ${secret.aws.s3.secret_key}
    region: ${secret.aws.s3.region}
    bucket-name: ${secret.aws.s3.bucket_name}
    cloudfront-domain: ${secret.aws.s3.cloudfront_domain}

admin:
  token: ${secret.admin.token}
