spring:
  thymeleaf:
    prefix: file:mykku-be-config/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false  # Development only, should be true in production

  # Web MVC
  web:
    resources:
      add-mappings: true

# Admin configuration
admin:
  token: ${ADMIN_TOKEN:change-this-in-production}  # Override via environment variable or dev-secret.yml
