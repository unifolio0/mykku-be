services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.4
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx-certs:/etc/nginx/certs:ro
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - /home/ubuntu/app/nginx/vhost.d/default:/etc/nginx/vhost.d/default:ro
      - /home/ubuntu/app/nginx/vhost.d/api.dev.mykku.kr_location:/etc/nginx/vhost.d/api.dev.mykku.kr_location:ro
    environment:
      - TZ=Asia/Seoul
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - proxy-network

  letsencrypt:
    image: nginxproxy/acme-companion:2.2
    container_name: letsencrypt
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx-certs:/etc/nginx/certs:rw
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - letsencrypt-acme:/etc/acme.sh
    environment:
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL:-admin@mykku.kr}
      - NGINX_PROXY_CONTAINER=nginx-proxy
      - TZ=Asia/Seoul
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - proxy-network

  mykku-app:
    image: ${DOCKER_USERNAME}/mykku-be:${IMAGE_TAG:-latest}
    container_name: mykku-app
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - TZ=Asia/Seoul
      - VIRTUAL_HOST=api.dev.mykku.kr
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=api.dev.mykku.kr
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-admin@mykku.kr}
    volumes:
      - /home/ubuntu/app/logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - proxy-network
    depends_on:
      nginx-proxy:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - TZ=Asia/Seoul
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-mykku}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - proxy-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      - TZ=Asia/Seoul
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - proxy-network

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    volumes:
      - /home/ubuntu/app/monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      - TZ=Asia/Seoul
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - proxy-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /home/ubuntu/app/monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    environment:
      - TZ=Asia/Seoul
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      - loki
    networks:
      - proxy-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - /home/ubuntu/app/monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - TZ=Asia/Seoul
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      - loki
    networks:
      - proxy-network

volumes:
  nginx-certs:
  nginx-vhost:
  nginx-html:
  letsencrypt-acme:
  loki-data:
  grafana-data:
  mysql-data:
  redis-data:

networks:
  proxy-network:
    driver: bridge
