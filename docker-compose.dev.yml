services:
  mykku-app:
    image: ${DOCKER_USERNAME}/mykku-be:${IMAGE_TAG:-latest}
    container_name: mykku-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - /home/ubuntu/app/logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
